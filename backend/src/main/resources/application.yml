server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8091}
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./.local/roomflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai
roomflow:
  demo: ${ROOMFLOW_DEMO:true}
